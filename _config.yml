# Site
name: 'AI4ALL'
description: 'AI4ALL - Artificial Intelligent For All-of-us'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
baseurl: '/ai4all'
disqus: 'AI4ALL'
email: 'ai4all@gmail.com'

include: ["_pages"]
permalink: /:title/

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  
authors:
    baro:
      name:           Baro
      site:           https://github.com/tonggiabao8825
      avatar:         /assets/images/baro.jpeg
      bio:            "Admin Baro - AI4ALL."
      email:          baro@ai4all.com
      twitter:        https://x.com/tonggiabao8825

    hieu:
      name:           Hieu
      site:           https://github.com/hieudev
      avatar:         /assets/images/avatar2.jpg
      bio:            "Admin Hieu - AI4ALL."
      email:          hieu@ai4all.com
      twitter:        https://twitter.com/hieu_ai4all
 
# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: baro
      avatar: /assets/images/avatar1.jpg
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10



# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]
